name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "53 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/RunConvert.Tests --filter "Category!=Live"

  live:
    name: Live API
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/RunConvert.Tests --filter "Category=Live" --logger "console;verbosity=detailed"
        env:
          RUNCONVERT_API_KEY: ${{ secrets.RUNCONVERT_API_KEY }}
